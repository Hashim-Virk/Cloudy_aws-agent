<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudy ☁️ - AWS Free Tier Advisor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            background-color: white;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 80vh;
        }
        .header {
            background-color: #232f3e;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.4;
            font-size: 0.95rem;
        }
        .bot {
            background-color: #f1f3f5;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .user {
            background-color: #ff9900;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .input-area {
            display: flex;
            padding: 15px;
            background-color: #fafafa;
            border-top: 1px solid #eee;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 0.95rem;
        }
        button {
            background-color: #ff9900;
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            margin-left: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
            background-color: #e88b00;
        }
        .loading {
            font-size: 0.8rem;
            color: #888;
            margin-top: -10px;
            margin-bottom: 10px;
            align-self: flex-start;
            display: none;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        ☁️ Cloudy - AWS Advisor
    </div>
    <div class="messages" id="chatbox">
        <div class="message bot">Hello! I'm Cloudy ☁️, your friendly AWS Free Tier Advisor! Ask me about EC2, S3, Lambda, or DynamoDB free tiers!</div>
    </div>
    <div class="loading" id="loading">Cloudy is typing...</div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask me something..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
    // REPLACE THIS WITH YOUR API GATEWAY URL AFTER DEPLOYMENT
    const API_URL = "https://u4x2t1pgx4.execute-api.us-east-1.amazonaws.com/Prod/chat"; 

    const chatbox = document.getElementById("chatbox");
    const userInput = document.getElementById("userInput");
    const loading = document.getElementById("loading");

    function appendMessage(text, sender) {
        const div = document.createElement("div");
        div.className = `message ${sender}`;
        div.innerText = text;
        chatbox.appendChild(div);
        chatbox.scrollTop = chatbox.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, "user");
        userInput.value = "";
        
        if (API_URL === "YOUR_API_GATEWAY_URL_HERE") {
            setTimeout(() => {
                appendMessage("Please deploy the backend and update API_URL in the HTML file to talk to me! 🌩️", "bot");
            }, 500);
            return;
        }

        loading.style.display = "block";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ message: text })
            });
            const data = await response.json();
            
            loading.style.display = "none";
            appendMessage(data.reply, "bot");
        } catch (error) {
            loading.style.display = "none";
            appendMessage("Oops! I couldn't reach the server. My clouds are disconnected! ⛈️", "bot");
            console.error(error);
        }
    }
</script>

</body>
</html>
